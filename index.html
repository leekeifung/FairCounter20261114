function save(){ try{ localStorage.setItem(KEY, JSON.stringify({
  events:state.events, log:state.log, operator:state.operator,
  eventId:state.eventId, client:state.client })); }catch(e){} }
function load(){ try{
  const r = localStorage.getItem(KEY); if(!r) return;
  const d = JSON.parse(r);
  if(d.events?.length) state.events = d.events;
  state.log = d.log || []; state.operator = d.operator || '';
  state.eventId = d.eventId || state.eventId; state.client = d.client || 'student';
  // Non-destructive merge: add any newly-seeded fairs (e.g. OCSC Bangkok) that
  // a returning user's saved data doesn't have yet, without touching their counts.
  SEED_EVENTS.forEach(se=>{ if(!state.events.some(e=>e.id===se.id)) state.events.push(se); });
}catch(e){} }

function toast(msg,type='info'){
  const c={info:'bg-slate-800 text-white',success:'bg-emerald-600 text-white',warn:'bg-amber-500 text-white',error:'bg-red-600 text-white'};
  const el=document.createElement('div'); el.className=`toast ${c[type]}`; el.textContent=msg;
  document.getElementById('toast').appendChild(el); setTimeout(()=>el.remove(),2200);
}

function eventCounts(evId){
  const m={};
  for(const r of state.log){ if(r.ev!==evId) continue;
    (m[r.prog] ||= {student:0,parent:0,teacher:0,other:0,total:0});
    m[r.prog][r.cl]++; m[r.prog].total++; }
  return m;
}
function eventTotal(evId){ return state.log.reduce((s,r)=>s+(r.ev===evId?1:0),0); }

/* ===========================================================
   3) COUNT ACTIONS
   =========================================================== */
function addCount(num){
  state.log.push({id:uid(), ev:state.eventId, cl:state.client, prog:num, op:state.operator||'—', ts:Date.now()});
  save(); refreshCounts(num,true);
}
function decCount(num){
  for(let i=state.log.length-1;i>=0;i--){ const r=state.log[i];
    if(r.ev===state.eventId && r.cl===state.client && r.prog===num){ state.log.splice(i,1); break; } }
  save(); refreshCounts(num,false);
}
function undoLast(){
  for(let i=state.log.length-1;i>=0;i--){ if(state.log[i].ev===state.eventId){ const r=state.log.splice(i,1)[0];
    save(); refreshCounts(r.prog,false); toast('↩️ Undid last count','warn'); return; } }
  toast('Nothing to undo','warn');
}
function refreshCounts(num,bump){
  const counts=eventCounts(state.eventId);
  const c=counts[num]||{student:0,parent:0,teacher:0,other:0,total:0};
  const tot=document.getElementById('cnt-'+num);
  if(tot){ tot.textContent=c.total; if(bump){tot.classList.remove('bump');void tot.offsetWidth;tot.classList.add('bump');} }
  const mini=document.getElementById('mini-'+num);
  if(mini) mini.innerHTML=CLIENTS.map(cl=>`<span class="px-1">${cl.icon}${c[cl.id]}</span>`).join('');
  const lb=document.getElementById('liveBadge'); if(lb) lb.textContent='● '+eventTotal(state.eventId);
  const sb=document.getElementById('sumBar'); if(sb) sb.innerHTML=summaryChips();
  const mc=document.getElementById('modal-cnt'); if(mc) mc.textContent=c.total;
}

/* ===========================================================
   4) VIEW SWITCH + RENDER
   =========================================================== */
function switchView(v){
  state.view=v;
  document.querySelectorAll('[id^="tab-"]').forEach(t=>{t.classList.remove('tab-active');t.classList.add('text-red-50');});
  const t=document.getElementById('tab-'+v); t.classList.add('tab-active'); t.classList.remove('text-red-50');
  render();
}
function render(){
  const sel=document.getElementById('eventSel');
  sel.innerHTML=state.events.map(e=>`<option value="${e.id}" ${e.id===state.eventId?'selected':''}>${e.day} ${fmtD(e.date)} · ${e.name} (${e.location})</option>`).join('');
  document.getElementById('liveBadge').textContent='● '+eventTotal(state.eventId);
  document.getElementById('operator').value=state.operator;

  const el=document.getElementById('content');
  if(state.view==='counter')        el.innerHTML=renderCounter();
  else if(state.view==='dashboard'){ el.innerHTML=renderDashboard(); setTimeout(buildCharts,30); }
  else if(state.view==='programmes')el.innerHTML=renderProgrammes();
  else if(state.view==='events')    el.innerHTML=renderEvents();
  else if(state.view==='data')      el.innerHTML=renderData();
}
function fmtD(d){ const x=new Date(d); return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }

/* ===========================================================
   5) COUNTER VIEW
   =========================================================== */
function clientControl(){
  return CLIENTS.map(c=>`
    <button onclick="state.client='${c.id}';save();render()"
      class="tap flex-1 px-2 py-2 rounded-lg text-sm font-bold border-2 ${state.client===c.id?'bg-red-700 text-white border-red-700 shadow':'bg-white text-slate-700 border-slate-200 hover:border-red-300'}">
      <span class="text-lg">${c.icon}</span><span class="ml-1 hidden sm:inline">${c.label}</span>
    </button>`).join('');
}
function summaryChips(){
  const counts=eventCounts(state.eventId); const t={student:0,parent:0,teacher:0,other:0,total:0};
  Object.values(counts).forEach(c=>CLIENTS.forEach(cl=>{t[cl.id]+=c[cl.id];t.total+=c[cl.id]/1;}));
  let tot=0; Object.values(counts).forEach(c=>tot+=c.total);
  return `<span class="font-bold text-red-700 text-base">${tot}</span><span class="text-slate-500"> total</span>`+
    CLIENTS.map(cl=>`<span class="ml-2">${cl.icon}<b>${t[cl.id]}</b></span>`).join('');
}
function renderCounter(){
  return `
  <div class="bg-white rounded-xl shadow-sm p-3 mb-3 sticky top-32 z-20">
    <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
      <div class="text-sm"><b>Step 1 · Who is asking?</b> <span class="text-slate-500">→ then tap the programme card</span></div>
      <button onclick="undoLast()" class="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">↩️ Undo</button>
    </div>
    <div class="flex gap-2 mb-2">${clientControl()}</div>
    <div id="sumBar" class="text-sm text-slate-600 border-t pt-2">${summaryChips()}</div>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-3 mb-3 flex gap-2 flex-wrap items-center">
    <input value="${state.search}" oninput="state.search=this.value;document.getElementById('grid').innerHTML=renderGrid()"
      placeholder="🔍 Search JUPAS (JS3220) / programme / faculty / #" class="flex-1 min-w-0 border rounded px-3 py-2 text-sm">
    <select onchange="state.facFilter=this.value;document.getElementById('grid').innerHTML=renderGrid()" class="border rounded px-2 py-2 text-sm">
      <option value="all">All faculties</option>
      ${FAC_ORDER.map(f=>`<option value="${f}" ${state.facFilter===f?'selected':''}>${FAC[f].icon} ${FAC[f].short}</option>`).join('')}
    </select>
  </div>

  <p class="text-xs text-slate-500 mb-2 px-1">💡 <b>Tap a card = +1</b> for the visitor type · tap <b>–</b> to correct · tap <b>ℹ️</b> for admissions details &amp; scores.</p>
  <div id="grid">${renderGrid()}</div>`;
}
function renderGrid(){
  const counts=eventCounts(state.eventId);
  const q=state.search.toLowerCase().trim();
  let html='';
  for(const f of FAC_ORDER){
    if(state.facFilter!=='all' && state.facFilter!==f) continue;
    let list=PROGRAMMES.filter(p=>p.fac===f);
    if(q) list=list.filter(p=>(''+p.num).includes(q)||(p.jupas&&p.jupas.toLowerCase().includes(q))||p.name.toLowerCase().includes(q)||FAC[f].name.toLowerCase().includes(q)||FAC[f].short.toLowerCase().includes(q));
    if(!list.length) continue;
    html+=`<div class="mb-4">
      <div class="flex items-center gap-2 mb-2"><span class="text-lg">${FAC[f].icon}</span>
        <h3 class="font-bold text-slate-700 text-sm">${FAC[f].name}</h3>
        <span class="text-xs ${FAC[f].chip} border px-2 rounded-full">${list.length}</span></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${list.map(p=>cardHTML(p,counts[p.num])).join('')}</div></div>`;
  }
  return html || '<p class="text-center text-slate-400 py-8">No programmes match.</p>';
}
function cardHTML(p,c){
  c=c||{student:0,parent:0,teacher:0,other:0,total:0};
  return `
  <div class="bg-white rounded-lg shadow-sm border-l-4 tap select-none hover:shadow-md transition-shadow" style="border-left-color:${FAC[p.fac].hex}">
    <div class="flex items-stretch">
      <button onclick="addCount(${p.num})" class="flex-1 text-left p-2.5 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-mono text-[11px] font-bold bg-slate-100 px-1.5 rounded">#${p.num}</span>
          ${p.jupas ? `<span class="font-mono text-[11px] font-bold text-red-800 bg-red-50 border border-red-200 px-1.5 rounded">(${p.jupas})</span>` : ''}
          ${p.code?`<span class="text-[10px] text-slate-400 font-mono">${p.code}</span>`:''}
          ${p.type==='broad'?'<span class="text-[10px] bg-slate-200 text-slate-600 px-1 rounded">Broad scheme</span>':''}
          ${(p.tags||[]).map(t=>`<span class="text-[10px] font-bold ${t==='A'?'text-green-600':'text-orange-600'}">${t==='A'?'Ⓐ':'Ⓘ'}</span>`).join('')}
        </div>
        <p class="text-xs leading-tight mt-1 font-semibold text-slate-800">${p.name}</p>
        <div class="text-[10px] text-slate-500 mt-1 flex items-center gap-2 flex-wrap">
          ${p.score !== undefined ? `<span>2026 Score: <b class="text-red-700">${p.score > 0 ? p.score : 'N/A'}</b> <span class="text-slate-400 text-[9px]">(${p.calc || 'Best 5'})</span></span>` : ''}
        </div>
        <div id="mini-${p.num}" class="text-[10px] text-slate-500 mt-1">${CLIENTS.map(cl=>`<span class="px-1">${cl.icon}${c[cl.id]}</span>`).join('')}</div>
      </button>
      <div class="flex flex-col items-center justify-center px-2 border-l border-slate-100">
        <span id="cnt-${p.num}" class="text-xl font-extrabold text-red-700">${c.total}</span>
        <div class="flex gap-1 mt-0.5">
          <button onclick="decCount(${p.num})" class="text-xs w-6 h-6 rounded bg-slate-100 hover:bg-red-100 text-slate-600">–</button>
          <button onclick="openProg(${p.num})" class="text-xs w-6 h-6 rounded bg-slate-100 hover:bg-blue-100" title="Talking points">ℹ️</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ===========================================================
   6) DASHBOARD VIEW
   =========================================================== */
function renderDashboard(){
  const ev=eventById(state.eventId); const counts=eventCounts(state.eventId);
  const tot=eventTotal(state.eventId);
  const byClient={student:0,parent:0,teacher:0,other:0};
  const byFac={}; FAC_ORDER.forEach(f=>byFac[f]=0);
  Object.entries(counts).forEach(([num,c])=>{ CLIENTS.forEach(cl=>byClient[cl.id]+=c[cl.id]);
    const p=progByNum(+num); if(p) byFac[p.fac]+=c.total; });
  let topFac='—',topN=-1; Object.entries(byFac).forEach(([f,n])=>{if(n>topN){topN=n;topFac=f;}});
  const uniqueProg=Object.keys(counts).length;

  const card=(v,l,cls)=>`<div class="bg-white rounded-xl shadow-sm p-3 text-center"><div class="text-2xl font-extrabold ${cls}">${v}</div><div class="text-xs text-slate-500">${l}</div></div>`;
  if(tot===0) return `<div class="bg-white rounded-xl shadow-sm p-8 text-center"><div class="text-5xl mb-2">📊</div>
    <p class="text-slate-600 mb-1">No counts yet for <b>${ev.name}</b>.</p>
    <p class="text-slate-400 text-sm mb-3">Go to the Counter tab and start tapping — or load demo data to preview the graphs.</p>
    <button onclick="loadDemo()" class="bg-red-700 text-white px-4 py-2 rounded text-sm">🎲 Load demo data</button></div>`;

  return `
  <div class="bg-white rounded-xl shadow-sm p-3 mb-3 flex items-center justify-between flex-wrap gap-2">
    <div><h2 class="font-bold text-slate-800">📊 ${ev.name}</h2>
      <p class="text-xs text-slate-500">${ev.day} ${fmtD(ev.date)}${ev.time?' · '+ev.time:''} · ${ev.location} · ${ev.type}</p></div>
    <button onclick="switchView('data')" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded">📥 Export this data</button>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
    ${card(tot,'Total enquiries','text-red-700')}
    ${card(uniqueProg,'Programmes asked','text-blue-700')}
    ${card(FAC[topFac].icon+' '+FAC[topFac].short,'Busiest faculty','text-emerald-700 text-base')}
    ${card(byClient.student,'Students','text-purple-700')}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="bg-white rounded-xl shadow-sm p-3"><h3 class="font-bold text-sm mb-2">👥 By visitor type</h3><canvas id="c-client" height="180"></canvas></div>
    <div class="bg-white rounded-xl shadow-sm p-3"><h3 class="font-bold text-sm mb-2">🏛️ By faculty / school</h3><canvas id="c-fac" height="180"></canvas></div>
    <div class="bg-white rounded-xl shadow-sm p-3 md:col-span-2"><h3 class="font-bold text-sm mb-2">🏆 Top 10 programmes</h3><canvas id="c-top" height="170"></canvas></div>
    <div class="bg-white rounded-xl shadow-sm p-3"><h3 class="font-bold text-sm mb-2">⏱️ Enquiries by hour</h3><canvas id="c-hour" height="190"></canvas></div>
    <div class="bg-white rounded-xl shadow-sm p-3"><h3 class="font-bold text-sm mb-2">📅 All fairs compared</h3><canvas id="c-evt" height="190"></canvas></div>
  </div>`;
}
function buildCharts(){
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); charts={};
  if(typeof Chart==='undefined') return;
  Chart.defaults.font.size=11;
  const counts=eventCounts(state.eventId);
  const byClient=CLIENTS.map(cl=>Object.values(counts).reduce((s,c)=>s+c[cl.id],0));
  const facLabels=[],facData=[],facCol=[];
  FAC_ORDER.forEach(f=>{ const n=Object.entries(counts).reduce((s,[num,c])=>s+(progByNum(+num)?.fac===f?c.total:0),0);
    if(n>0){facLabels.push(FAC[f].short);facData.push(n);facCol.push(FAC[f].hex);} });
  const top=Object.entries(counts).map(([num,c])=>({num:+num,t:c.total})).sort((a,b)=>b.t-a.t).slice(0,10);

  const C=(id,cfg)=>{const el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);};
  C('c-client',{type:'doughnut',data:{labels:CLIENTS.map(c=>c.icon+' '+c.label),datasets:[{data:byClient,backgroundColor:CLIENTS.map(c=>c.hex)}]},options:{plugins:{legend:{position:'bottom'}}}});
  C('c-fac',{type:'bar',data:{labels:facLabels,datasets:[{data:facData,backgroundColor:facCol}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  C('c-top',{type:'bar',data:{labels:top.map(t=>'#'+t.num+' '+(progByNum(t.num).jupas?`(${progByNum(t.num).jupas}) `:` `)+progByNum(t.num).name.slice(0,28)),datasets:[{data:top.map(t=>t.t),backgroundColor:top.map(t=>FAC[progByNum(t.num).fac].hex)}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}});
  
  const hours={}; state.log.filter(r=>r.ev===state.eventId).forEach(r=>{const h=new Date(r.ts).getHours();hours[h]=(hours[h]||0)+1;});
  const hk=Object.keys(hours).map(Number).sort((a,b)=>a-b);
  C('c-hour',{type:'line',data:{labels:hk.map(h=>h+':00'),datasets:[{data:hk.map(h=>hours[h]),fill:true,borderColor:'#dc2626',backgroundColor:'rgba(220,38,38,.12)',tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  C('c-evt',{type:'bar',data:{labels:state.events.map(e=>e.name.slice(0,16)),datasets:[{data:state.events.map(e=>eventTotal(e.id)),backgroundColor:state.events.map(e=>e.id===state.eventId?'#dc2626':'#cbd5e1')}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}

/* ===========================================================
   7) PROGRAMMES VIEW + TALKING-POINTS MODAL
   =========================================================== */
function renderProgrammes(){
  return `
  <div class="bg-white rounded-xl shadow-sm p-3 mb-3">
    <h2 class="font-bold text-slate-800">🎓 Programme directory &amp; talking points</h2>
    <p class="text-xs text-slate-500">All application choices from the 2026/27 list. Click any card for the introduction script &amp; 2026 admissions score. Ⓐ = AIDA secondary major · Ⓘ = Innovation &amp; Entrepreneurship.</p>
    <input value="${state.search}" oninput="state.search=this.value;document.getElementById('plist').innerHTML=progList()" placeholder="🔍 Search JUPAS code (e.g. JS3220) or programme title…" class="w-full border rounded px-3 py-2 text-sm mt-2">
  </div>
  <div id="plist">${progList()}</div>`;
}
function progList(){
  const q=state.search.toLowerCase().trim(); let html='';
  for(const f of FAC_ORDER){
    let list=PROGRAMMES.filter(p=>p.fac===f);
    if(q) list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.jupas&&p.jupas.toLowerCase().includes(q))||(''+p.num).includes(q)||FAC[f].name.toLowerCase().includes(q));
    if(!list.length) continue;
    html+=`<div class="mb-3"><div class="flex items-center gap-2 mb-1.5"><span>${FAC[f].icon}</span><h3 class="font-bold text-sm text-slate-700">${FAC[f].name}</h3></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${list.map(p=>`
        <button onclick="openProg(${p.num})" class="text-left bg-white rounded-lg shadow-sm p-2.5 border-l-4 tap hover:shadow-md" style="border-left-color:${FAC[p.fac].hex}">
          <div class="flex items-center gap-1 flex-wrap"><span class="font-mono text-[11px] font-bold bg-slate-100 px-1 rounded">#${p.num}</span>
          ${p.jupas ? `<span class="font-mono text-[11px] font-bold text-red-800 bg-red-50 border border-red-200 px-1 rounded">(${p.jupas})</span>` : ''}
          ${p.featured?'<span class="text-[10px]">⭐</span>':''}${(p.tags||[]).map(t=>`<span class="text-[10px] font-bold ${t==='A'?'text-green-600':'text-orange-600'}">${t==='A'?'Ⓐ':'Ⓘ'}</span>`).join('')}</div>
          <p class="text-xs text-slate-700 mt-0.5 leading-tight font-medium">${p.name}</p>
          ${p.score !== undefined ? `<div class="text-[10px] text-slate-500 mt-1">2026 Score: <b class="text-slate-700">${p.score > 0 ? p.score : 'N/A'}</b> (${p.calc || 'Best 5'})</div>` : ''}
        </button>`).join('')}</div></div>`;
  }
  return html;
}
function openProg(num){
  const p=progByNum(num); const info=PROG_INFO[num]||{};
  const c=(eventCounts(state.eventId)[num])||{total:0};
  const sec=(icon,title,body)=>`<div class="border rounded-lg p-2.5"><div class="font-bold text-xs text-slate-700 mb-0.5">${icon} ${title}</div><div class="text-xs text-slate-600 leading-relaxed">${body}</div></div>`;
  const ph=t=>`<span class="text-slate-400 italic">➕ ${t} — add in <code>PROG_INFO[${num}]</code></span>`;

  const scoreInfo = p.score !== undefined 
    ? `• <b>2026 JUPAS Average HKDSE Score (Exclude NAS offers):</b> <span class="text-red-700 font-bold">${p.score > 0 ? p.score : 'N/A'}</span><br>• <b>Score Calculation Mechanism:</b> ${p.calc || 'Best 5'}`
    : '';

  document.getElementById('modalBody').innerHTML=`
    <div class="p-4 rounded-t-xl text-white" style="background:${FAC[p.fac].hex}">
      <div class="flex justify-between items-start">
        <div><div class="text-xs opacity-90">${FAC[p.fac].icon} ${FAC[p.fac].name}</div>
          <h2 class="font-extrabold leading-tight mt-0.5">#${p.num} ${p.jupas ? `(${p.jupas})` : ''} · ${p.name}</h2>
          <div class="text-xs opacity-90 mt-1">${p.jupas ? 'JUPAS Code: '+p.jupas+' · ' : ''}${p.code?'PolyU Code '+p.code+' · ':''}${(p.tags||[]).map(t=>t==='A'?'Ⓐ AIDA':'Ⓘ IE').join(' · ')||''} ${p.note?'· '+p.note:''}</div></div>
        <button onclick="closeModal()" class="text-white/90 text-2xl leading-none">×</button>
      </div>
      ${p.spec?`<div class="mt-2 flex flex-wrap gap-1">${p.spec.map(s=>`<span class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded">${s}</span>`).join('')}</div>`:''}
    </div>
    <div class="p-4 space-y-2 max-h-[60vh] overflow-y-auto">
      <div class="flex items-center justify-between bg-slate-50 rounded-lg p-2">
        <span class="text-xs text-slate-500">Counted at <b>${eventById(state.eventId).name}</b>: <b id="modal-cnt" class="text-red-700">${c.total}</b></span>
        <div class="flex gap-1">${CLIENTS.map(cl=>`<button onclick="state.client='${cl.id}';addCount(${num})" class="text-xs ${state.client===cl.id?'bg-red-700 text-white':'bg-white border'} px-2 py-1 rounded">+1 ${cl.icon}</button>`).join('')}</div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        ${sec('📚','What you study (4 yrs)', info.study || ph('study outline'))}
        ${sec('💼','Careers / what you can do', info.careers || ph('career outcomes'))}
        ${sec('🏅','Rankings', UNI.rankings.map(r=>'• '+r).join('<br>')+'<br>'+(info.subjectRanking?'• '+info.subjectRanking:ph('subject ranking')))}
        ${sec('🎓','Scholarships', UNI.scholarship)}
        ${sec('✈️','Exchange', UNI.exchange)}
        ${sec('🛠️','Internship & jobs', UNI.internship)}
        ${sec('🏠','Hall life', UNI.hall)}
        ${sec('🌏','Hong Kong life', UNI.hklife)}
        ${sec('🌐','Culture & diversity', UNI.culture)}
        ${sec('💰','Fees', UNI.fees)}
        ${sec('📝','2026 Admissions & Score Remarks', (scoreInfo ? scoreInfo + '<br><br>' : '') + UNI.admission)}
        ${sec('🗓️','Apply', UNI.timeline)}
      </div>
      ${info.plannerUrl?`<a href="${info.plannerUrl}" target="_blank" class="block text-center bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 text-sm font-semibold">🔗 Open programme structure / planner</a>`
        :`<div class="text-center text-xs text-slate-400 italic border border-dashed rounded-lg py-2">🔗 Add a planner link in <code>PROG_INFO[${num}].plannerUrl</code> (e.g. your AMA-JS3220X planner)</div>`}
    </div>`;
  const m=document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex');
}
function closeModal(){ const m=document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); if(state.view==='counter')render(); }

   8) FAIRS (events) VIEW

function addEvent(){
  const name=val('ev-name'),date=val('ev-date'),loc=val('ev-loc'),type=val('ev-type'),time=val('ev-time');
  if(!name||!date){toast('Need a name and date','warn');return;}
  const day=new Date(date).toLocaleDateString('en-GB',{weekday:'short'});
  state.events.push({id:'ev-'+uid(),name,date,location:loc||'—',type,day,time});
  save();render();toast('✅ Fair added','success');
}
function delEvent(id){
  if(eventTotal(id)>0 && !confirm('This fair has counts. Delete the fair AND its counts?'))return;
  state.events=state.events.filter(e=>e.id!==id);
  state.log=state.log.filter(r=>r.ev!==id);
  if(state.eventId===id && state.events[0]) state.eventId=state.events[0].id;
  save();render();toast('🗑️ Deleted','info');
}
const val=id=>document.getElementById(id).value.trim();

/* ===========================================================
   9) DATA / GUIDE VIEW
   =========================================================== */
function renderData(){
  return `
  <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
    <h2 class="font-bold text-slate-800 mb-2">💾 Export / Import</h2>
    <p class="text-xs text-slate-500 mb-3">Data auto-saves in your browser. <b>Always export a CSV/JSON backup after each fair</b>.</p>
    <div class="flex flex-wrap gap-2">
      <button onclick="exportCSV()" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm">📥 Export CSV (raw log)</button>
      <button onclick="exportJSON()" class="bg-slate-700 text-white px-3 py-1.5 rounded text-sm">📦 Export JSON (full backup)</button>
      <button onclick="importJSON()" class="bg-slate-600 text-white px-3 py-1.5 rounded text-sm">📤 Import JSON</button>
      <button onclick="loadDemo()" class="bg-amber-500 text-white px-3 py-1.5 rounded text-sm">🎲 Load demo data</button>
      <button onclick="if(confirm('Erase ALL counts (keeps fairs)?')){state.log=[];save();render();}" class="bg-red-600 text-white px-3 py-1.5 rounded text-sm">🗑️ Clear all counts</button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
    <h2 class="font-bold text-slate-800 mb-1">🔐 Cloudflare Authentication integration</h2>
    <p class="text-xs text-slate-500 mb-2">Reuse your <code>CloudFireLogin.html</code> pattern for authenticated multi-rep tracking.</p>
    <ol class="text-xs text-slate-600 list-decimal ml-4 space-y-1">
      <li>Host on <b>Cloudflare Pages</b> behind <b>Cloudflare Access</b> (Zero-Trust).</li>
      <li>Use <b>Cloudflare Turnstile</b> for verification and read authenticated headers via Pages Functions.</li>
      <li>Store shared logs with <b>Cloudflare D1</b> (SQLite) or <b>KV</b>.</li>
    </ol>
  </div>`;
}
function csv(v){ v=(''+v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v; }
function download(text,name,mime){ const b=new Blob([text],{type:mime}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function exportCSV(){
  const rows=[["record_id","event_id","event_name","date","time","location","event_type","client","prog_no","jupas_code","programme","faculty","operator","timestamp"]];
  state.log.forEach(r=>{ const e=eventById(r.ev)||{},p=progByNum(r.prog)||{};
    rows.push([r.id,r.ev,e.name||'',e.date||'',e.time||'',e.location||'',e.type||'',r.cl,r.prog,p.jupas||'',p.name||'',(FAC[p.fac]||{}).name||'',r.op||'',new Date(r.ts).toISOString()]); });
  download(rows.map(x=>x.map(csv).join(',')).join('\n'),`polyu-fair-${Date.now()}.csv`,'text/csv');
  toast('📥 CSV exported','success');
}
function exportJSON(){ download(JSON.stringify({events:state.events,log:state.log,operator:state.operator,exportedAt:new Date().toISOString()},null,2),`polyu-fair-backup-${Date.now()}.json`,'application/json'); toast('📦 JSON exported','success'); }
function importJSON(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json';
  i.onchange=e=>{const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      if(d.events) state.events=d.events; if(d.log) state.log=d.log; if(d.operator) state.operator=d.operator;
      if(!eventById(state.eventId)&&state.events[0]) state.eventId=state.events[0].id;
      save();render();toast('📤 Imported','success');}catch(err){toast('Invalid JSON','error');}};
    rd.readAsText(f);}; i.click(); }
function loadDemo(){
  if(state.log.length && !confirm('Add demo data on top of existing counts?'))return;
  const pop=[11,11,12,13,8,9,46,44,24,32,22,30,33,2,3];
  state.events.forEach(e=>{ const base=new Date(e.date+'T10:00:00').getTime();
    const n=70+Math.floor(Math.random()*90);
    for(let i=0;i<n;i++){ const prog=Math.random()<.45?pop[Math.floor(Math.random()*pop.length)]:PROGRAMMES[Math.floor(Math.random()*PROGRAMMES.length)].num;
      const cl=['student','student','student','parent','parent','teacher','other'][Math.floor(Math.random()*7)];
      state.log.push({id:uid(),ev:e.id,cl,prog,op:state.operator||'Demo',ts:base+Math.floor(Math.random()*6*3600*1000)}); } });
  save();toast('🎲 Demo data loaded','success');render();
}

/* ===========================================================
   10) LOGIN STUB
   =========================================================== */
function openLogin(){
  document.getElementById('modalBody').innerHTML=`
    <div class="p-5">
      <div class="text-center mb-3"><div class="text-3xl">🔐</div><h2 class="font-bold text-slate-800">Operator Sign-In</h2>
      <p class="text-xs text-slate-500">Local session identification tag.</p></div>
      <input id="login-name" value="${state.operator||''}" placeholder="Name / Staff ID" class="w-full border rounded px-3 py-2 text-sm mb-2">
      <button onclick="state.operator=document.getElementById('login-name').value.trim();save();closeModal();render();toast('👋 Signed in as '+(state.operator||'—'),'success')" class="w-full bg-red-700 text-white rounded py-2 text-sm font-semibold">Sign in</button>
    </div>`;
  const m=document.getElementById('modal'); m.classList.remove('hidden'); m.classList.add('flex');
}

/* ===========================================================
   11) INIT
   =========================================================== */
(function init(){ load(); if(!eventById(state.eventId)&&state.events[0]) state.eventId=state.events[0].id; render(); })();
</script>
</body>
</html>
